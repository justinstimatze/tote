[project]
name = "tote"
version = "0.1.0"
requires-python = ">=3.12"
description = "A Claude Code Stop hook that catches guesses stated as fact and has the agent check them before you rely on them"
readme = "README.md"
license = "MIT"
dependencies = [
    "anthropic>=2.3.0",
]

# a package, so `uv run --project <tote> python -m tote.check` imports tote from any working directory (the Stop
# hook runs in other projects); as a virtual project it only imported when the cwd was this repo
[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
